name: Promote development to master

on:
  pull_request:
    branches:
      - development
    types:
      - closed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-development-to-master
  cancel-in-progress: false

jobs:
  open-promotion-pr:
    name: Open promotion PR
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PROMOTION_HEAD: ${{ github.repository_owner }}:development
      SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check for an existing promotion PR
        id: existing-pr
        shell: bash
        run: |
          set -euo pipefail

          open_pr_count="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base master \
            --head "$PROMOTION_HEAD" \
            --state open \
            --json number \
            --jq 'length')"

          if [[ "$open_pr_count" -gt 0 ]]; then
            echo "An open development-to-master promotion PR already exists; skipping creation."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Create promotion PR
        if: steps.existing-pr.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base master \
            --head "$PROMOTION_HEAD" \
            --title "Promote development to master" \
            --body "Automated promotion after merged pull request #${SOURCE_PR_NUMBER} into development."
